name: findar
description: "Findar: real-estate marketplace for Algeria."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  group_button: ^5.3.4
  main_button: ^0.0.19
  shared_preferences: ^2.2.2
  provider: ^6.0.5
  flutter_bloc: ^8.1.1
  equatable: ^2.0.5
  http: ^1.1.0
  image_picker: ^1.0.7
  sqflite: ^2.0.0
  path: ^1.8.0
  path_provider: ^2.1.5
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_auth: ^6.6.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.4
  flutter_localizations:
    sdk: flutter

  get_it: ^9.2.0

  json_annotation: ^4.9.0
  cloudinary_flutter: ^1.3.0
  cloudinary_url_gen: ^1.8.0
  internet_connection_checker_plus: ^2.9.1+2
  flutter_dotenv: ^5.1.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  mocktail: ^1.0.5
  bloc_test: ^9.1.7
  sqflite_common_ffi: ^2.4.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
    

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/
    - .env

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "#0A5FC2"
  adaptive_icon_foreground: "assets/brand/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/brand/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0E1014"
  image: assets/brand/splash_tile.png
  image_dark: assets/brand/splash_tile.png
  android_12:
    image: assets/brand/splash_android12.png
    image_dark: assets/brand/splash_android12.png
    color: "#FFFFFF"
    color_dark: "#0E1014"
  ios: true
  web: false
